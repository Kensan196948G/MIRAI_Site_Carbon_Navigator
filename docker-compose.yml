services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=mirai_carbon
      - POSTGRES_USER=mirai
      - POSTGRES_PASSWORD=mirai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirai -d mirai_carbon"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql+psycopg2://mirai:mirai@db:5432/mirai_carbon
      - MIRAI_SECRET_KEY=change-me-in-production
      - MIRAI_CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
    restart: unless-stopped

volumes:
  pgdata:
