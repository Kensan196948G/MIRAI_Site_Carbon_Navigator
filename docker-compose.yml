services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=mirai_carbon
      - POSTGRES_USER=mirai
      - POSTGRES_PASSWORD=mirai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirai -d mirai_carbon"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql+psycopg2://mirai:mirai@db:5432/mirai_carbon
      - MIRAI_SECRET_KEY=${MIRAI_SECRET_KEY:-change-me-in-production}
      - MIRAI_CORS_ORIGINS=${MIRAI_CORS_ORIGINS:-http://localhost:8010,http://127.0.0.1:8010,https://carbon.mirai-dx-platform.com}
      - MIRAI_ENABLE_HSTS=${MIRAI_ENABLE_HSTS:-0}
      - MIRAI_RATE_LIMIT_PER_MIN=${MIRAI_RATE_LIMIT_PER_MIN:-300}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
