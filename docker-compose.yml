services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=mirai_carbon
      - POSTGRES_USER=mirai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mirai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirai -d mirai_carbon"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8020:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql+psycopg2://mirai:${POSTGRES_PASSWORD:-mirai}@db:5432/mirai_carbon
      - MIRAI_SECRET_KEY=${MIRAI_SECRET_KEY:-change-me-in-production}
      - MIRAI_ENV=${MIRAI_ENV:-production}
      - MIRAI_SEED_DEFAULT_USERS=${MIRAI_SEED_DEFAULT_USERS:-0}
      - MIRAI_INITIAL_ADMIN_PASSWORD=${MIRAI_INITIAL_ADMIN_PASSWORD:-}
      - MIRAI_INITIAL_ADMIN_USERNAME=${MIRAI_INITIAL_ADMIN_USERNAME:-admin}
      - MIRAI_CORS_ORIGINS=${MIRAI_CORS_ORIGINS:-http://localhost:8010,http://127.0.0.1:8010,https://carbon.mirai-dx-platform.com}
      - MIRAI_ENABLE_HSTS=${MIRAI_ENABLE_HSTS:-1}
      - MIRAI_RATE_LIMIT_PER_MIN=${MIRAI_RATE_LIMIT_PER_MIN:-300}
      - MIRAI_LOGIN_MAX_FAILURES=${MIRAI_LOGIN_MAX_FAILURES:-10}
      - MIRAI_SMTP_HOST=${MIRAI_SMTP_HOST:-}
      - MIRAI_SMTP_PORT=${MIRAI_SMTP_PORT:-587}
      - MIRAI_SMTP_USER=${MIRAI_SMTP_USER:-}
      - MIRAI_SMTP_PASSWORD=${MIRAI_SMTP_PASSWORD:-}
      - MIRAI_SMTP_FROM=${MIRAI_SMTP_FROM:-}
      - MIRAI_SMTP_TLS=${MIRAI_SMTP_TLS:-1}
      - MIRAI_TEAMS_WEBHOOK=${MIRAI_TEAMS_WEBHOOK:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
